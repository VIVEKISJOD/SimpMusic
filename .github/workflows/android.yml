name: Build release APK (FOSS)
on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Apply AmeOS overlay
        run: |
          if [ -f ameos-overlay.zip ]; then unzip -o ameos-overlay.zip; fi

      - name: Update build product flavor
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Update Last.fm secrets
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > ./local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> ./local.properties

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Build release APK
        run: ./gradlew androidApp:assembleRelease -x uploadSentryProguardMappingsRelease

      - name: Sign APK
        run: |
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          TOOLS=/usr/local/lib/android/sdk/build-tools/$BT
          keytool -genkeypair -keystore ci.jks -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VAME"
          APK=$(ls androidApp/build/outputs/apk/release/*.apk | head -n 1)
          $TOOLS/zipalign -p -f 4 "$APK" aligned.apk
          $TOOLS/apksigner sign --ks ci.jks --ks-pass pass:android --key-pass pass:android --out androidApp/build/outputs/apk/release/app-signed.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: androidApp/build/outputs/apk/release/app-signed.apk

  build-vivo:
    runs-on: ubuntu-latest
    steps:
